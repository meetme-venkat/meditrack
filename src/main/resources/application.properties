spring.application.name=meditrack

# Database (smell: password in plain text — externalise it).
# ddl-auto=validate: schema is owned by db/meditrack_schema.sql, Hibernate must not mutate it.
spring.datasource.url=jdbc:postgresql://localhost:5432/meditrack_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
